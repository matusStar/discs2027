title: UK & Ireland Discs Meeting 2027
description: The UK & Ireland Discs Meeting 2027
url: "https://ukidiscs.github.io"
baseurl: "/discs2027"

remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: dark
search: true
lunr:
  search_within_pages: true

markdown: kramdown

include:
  - _pages

header:
  image: /assets/images/disc.jpg
  caption: "Credit: SpaceEngine © Cosmographic Software LLC."

atom_feed:
  hide: true            # removes the "Feed" link from the footer

logo: "/assets/images/UKI_Logo_notext.png"

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/matusStar/discs2027"
  # Text added here will appear in the bottom-right next to "Powered by Jekyll & Minimal Mistakes"
  custom: "My Footer"